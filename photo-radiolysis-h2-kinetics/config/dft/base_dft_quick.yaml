backend: gpaw
xc: PBE
mode: lcao
basis: dzp
kpts: [1, 1, 1]
gamma_only: true
vacuum: 15.0
optimizer: BFGS
fmax: 0.20
max_steps: 2
scf_maxiter: 8
convergence:
  energy: 1.0e-3
  density: 5.0e-3
  eigenstates: 5.0e-3
spin_polarized: false
charge: 0.0
restart: true
allow_mock_fallback: true

output_paths:
  structures: data/dft/structures
  calculations: data/dft/calculations
  results: data/dft/results
  summary: data/dft/results/summary

structure:
  repeat: [3, 3, 1]
  graphene_a: 2.48
  nitrogen_fraction: 0.56
  vacuum: 15.0

interface:
  fragment_variants: [ybtm]
  default_fragment_variant: ybtm
  placement_options: [n_rich, defect_adjacent]
  separation_values: [2.8]
  vacuum: 14.0

adsorption:
  use_surface_model: pristine
  candidate_sites:
    - name: n_rich
      site_type: n_rich
      height: 2.5
    - name: ring_center
      site_type: ring_center
      height: 2.8
    - name: defect_adjacent
      site_type: defect_adjacent
      height: 2.4

electronic:
  dos_points: 240
  dos_width: 0.20
  compute_charge_density_difference: true

references:
  adsorbate_energies:
    H: -1.0
    OH: -10.0
    H2O: -14.2
    H2: -6.7
