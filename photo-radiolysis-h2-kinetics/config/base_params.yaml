model:
  coupling_mode: custom

  dose_rate: 1.0
  light_intensity: 1.0
  catalyst_loading: 1.0
  radiolysis_scale: 0.35

  G_eaq: 0.025
  G_H: 0.015
  G_OH: 0.02

  k_photo_gen: 0.09
  k_rec: 0.08
  k_eaq_loss: 0.015
  k_eaq_hplus: 0.03
  k_eaq_hvb: 0.015
  k_eaq_to_ecb: 0.018

  k_hr_hr: 0.18
  k_hr_scav: 0.03
  k_oh_scav: 0.045
  k_hr_oh: 0.01

  k_ecb_hplus: 0.03
  k_ecb_trap: 0.012
  k_hvb_scav: 0.03
  k_hvb_hr: 0.015

  k_oh_ads_eff: 0.032
  k_oh_des_eff: 0.02
  k_oh_clear_eff: 0.038
  lambda_photo_block: 0.22

  alpha_sep: 0.9
  gamma_eaq_sep: 0.0
  K_site: 0.8
  interfacial_transfer_gain: 1.0
  defect_hydrogen_gain: 1.0
  defect_oh_penalty: 1.0
  alpha_H_defect: 0.45
  alpha_CT_defect: 0.35
  alpha_OH_penalty: 0.55
  defect_activity_min: 0.5
  defect_activity_max: 2.0
  defect_activity_secondary_max: 1.7
  theta_oh_soft_max: 1.1
  dft_prior_blend: 0.85
  dft_priors_path: data/dft/results/summary/dft_kinetic_priors.json
  use_dft_priors: false
  hydrogen_activation_score: 0.0
  interfacial_transfer_score: 0.0
  oh_poisoning_risk_score: 0.0
  defect_activity_score: 0.0

mechanisms:
  enable_hvb_hr_quench: true
  enable_hr_oh_neutralization: true
  enable_eaq_to_ecb_transfer: true
  enable_recombination_modulation: true
  enable_eaq_assisted_separation: false

simulation:
  t_start: 0.0
  t_end: 80.0
  n_eval: 320

solver:
  atol: 1.0e-9
  rtol: 1.0e-6

units:
  normalized: true
  concentration_scale: 1.0

initial_conditions:
  e_aq: 0.0
  h_plus: 1.0
  h_rad: 0.0
  oh_rad: 0.0
  theta_oh: 0.0
  e_cb: 0.0
  h_vb: 0.0
  h2: 0.0
  scav: 0.5
  trap: 0.0
