model:
  coupling_mode: neutral

  dose_rate: 0.35
  light_intensity: 1.3
  catalyst_loading: 1.0
  radiolysis_scale: 0.2

  G_eaq: 0.025
  G_H: 0.015
  G_OH: 0.02

  k_photo_gen: 0.09
  k_rec: 0.42
  k_eaq_loss: 0.015
  k_eaq_hplus: 0.0267
  k_eaq_hvb: 0.02
  k_eaq_to_ecb: 0.02

  k_hr_hr: 0.18
  k_hr_scav: 0.03
  k_oh_scav: 0.045
  k_hr_oh: 0.01

  k_ecb_hplus: 0.033
  k_ecb_trap: 0.0195
  k_hvb_scav: 0.08
  k_hvb_hr: 0.06
  k_oh_ads_eff: 0.034
  k_oh_des_eff: 0.018
  k_oh_clear_eff: 0.035
  lambda_photo_block: 0.26

  alpha_sep: 1.0
  gamma_eaq_sep: 15.0
  K_site: 1.31
  interfacial_transfer_gain: 1.05
  defect_hydrogen_gain: 1.05
  defect_oh_penalty: 1.1
  alpha_H_defect: 0.42
  alpha_CT_defect: 0.32
  alpha_OH_penalty: 0.55
  theta_oh_soft_max: 1.1
  use_dft_priors: false

mechanisms:
  enable_hvb_hr_quench: true
  enable_hr_oh_neutralization: true
  enable_eaq_to_ecb_transfer: true
  enable_recombination_modulation: true
  enable_eaq_assisted_separation: true

simulation:
  t_start: 0.0
  t_end: 80.0
  n_eval: 320

solver:
  atol: 1.0e-9
  rtol: 1.0e-6

units:
  normalized: true
  concentration_scale: 1.0

initial_conditions:
  e_aq: 0.0
  h_plus: 1.0
  h_rad: 0.0
  oh_rad: 0.0
  theta_oh: 0.0
  e_cb: 0.0
  h_vb: 0.0
  h2: 0.0
  scav: 0.5
  trap: 0.0
